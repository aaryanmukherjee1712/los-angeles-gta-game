
<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Los Angeles Open World</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  overflow: hidden;
  background: #111;
  font-family: Arial, sans-serif;
}
#hud {
  position: absolute;
  top: 15px;
  left: 15px;
  color: white;
  background: #000a;
  padding: 14px;
  border-radius: 10px;
  line-height: 1.7;
  z-index: 2;
}
#help {
  position: absolute;
  bottom: 15px;
  left: 15px;
  color: white;
  background: #000a;
  padding: 12px;
  border-radius: 10px;
}
</style>
</head>
<body>

<div id="hud">
  <b>LOS ANGELES</b><br>
  OPEN WORLD<br>
  Snelheid: <span id="speed">0</span> km/u
</div>

<div id="help">
  ↑ Vooruit &nbsp; ↓ Achteruit<br>
  ← Links &nbsp; → Rechts<br>
  SPATIE = Remmen
</div>

<script type="module">
import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

// SCENE
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87bce0);
scene.fog = new THREE.Fog(0x87bce0, 100, 450);

// CAMERA
const camera = new THREE.PerspectiveCamera(
  70, window.innerWidth / window.innerHeight, 0.1, 1000
);
camera.position.set(0, 7, 13);

// RENDERER
const renderer = new THREE.WebGLRenderer({
  antialias: false
});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
renderer.shadowMap.enabled = false;
document.body.appendChild(renderer.domElement);

// LIGHTING
scene.add(new THREE.HemisphereLight(0xffffff, 0x52606b, 2));

const sun = new THREE.DirectionalLight(0xffffff, 2);
sun.position.set(-40, 80, 30);
scene.add(sun);

// MATERIALS
const roadMat = new THREE.MeshStandardMaterial({
  color: 0x292d32, roughness: 0.95
});
const groundMat = new THREE.MeshStandardMaterial({
  color: 0x68785b
});
const lineMat = new THREE.MeshBasicMaterial({
  color: 0xffffff
});

// GROUND
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(1000, 1000),
  groundMat
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.12;
scene.add(ground);

// MAIN ROAD
const road = new THREE.Mesh(
  new THREE.PlaneGeometry(18, 1000),
  roadMat
);
road.rotation.x = -Math.PI / 2;
road.position.y = 0;
scene.add(road);

// ROAD MARKINGS
for (let z = -490; z < 500; z += 12) {
  const line = new THREE.Mesh(
    new THREE.PlaneGeometry(0.22, 5),
    lineMat
  );
  line.rotation.x = -Math.PI / 2;
  line.position.set(0, 0.025, z);
  scene.add(line);
}

// SIDEWALKS
for (const x of [-10, 10]) {
  const sidewalk = new THREE.Mesh(
    new THREE.BoxGeometry(3, 0.25, 1000),
    new THREE.MeshStandardMaterial({color: 0x999999})
  );
  sidewalk.position.set(x, 0.05, 0);
  scene.add(sidewalk);
}

// CITY BUILDINGS
const buildingColors = [
  0x9c9b91, 0xb7a994, 0x777f88,
  0xd0c5ae, 0x77716c, 0x9aabb2
];

for (let side of [-1, 1]) {
  for (let i = 0; i < 65; i++) {
    const height = 8 + Math.random() * 55;
    const width = 8 + Math.random() * 10;
    const depth = 12 + Math.random() * 15;
    const x = side * (20 + Math.random() * 35);
    const z = -480 + i * 15;

    const building = new THREE.Mesh(
      new THREE.BoxGeometry(width, height, depth),
      new THREE.MeshStandardMaterial({
        color: buildingColors[
          Math.floor(Math.random() * buildingColors.length)
        ],
        roughness: 0.85
      })
    );

    building.position.set(x, height / 2, z);
    scene.add(building);

    // WINDOWS
    const windowMat = new THREE.MeshBasicMaterial({
      color: 0x8fc5d9
    });

    for (let floor = 1; floor < height / 4; floor++) {
      for (let w = -1; w <= 1; w++) {
        const windowMesh = new THREE.Mesh(
          new THREE.BoxGeometry(1.1, 1.5, 0.12),
          windowMat
        );
        windowMesh.position.set(
          x + w * 2.2,
          floor * 3.5,
          z + depth / 2 + 0.07
        );
        scene.add(windowMesh);
      }
    }
  }
}

// CAR
const car = new THREE.Group();
scene.add(car);

const bodyMat = new THREE.MeshStandardMaterial({
  color: 0xb50018,
  metalness: 0.65,
  roughness: 0.3
});

const glassMat = new THREE.MeshStandardMaterial({
  color: 0x182e3b,
  metalness: 0.4,
  roughness: 0.2
});

const body = new THREE.Mesh(
  new THREE.BoxGeometry(2.2, 0.8, 4.5),
  bodyMat
);
body.position.y = 0.85;
car.add(body);

const cabin = new THREE.Mesh(
  new THREE.BoxGeometry(1.75, 0.8, 2.2),
  glassMat
);
cabin.position.set(0, 1.55, -0.25);
car.add(cabin);

// WHEELS
const wheels = [];

for (const x of [-1.15, 1.15]) {
  for (const z of [-1.4, 1.4]) {
    const wheel = new THREE.Mesh(
      new THREE.CylinderGeometry(0.48, 0.48, 0.32, 16),
      new THREE.MeshStandardMaterial({color: 0x171717})
    );
    wheel.rotation.z = Math.PI / 2;
    wheel.position.set(x, 0.5, z);
    car.add(wheel);
    wheels.push(wheel);
  }
}

// HEADLIGHTS
for (const x of [-0.75, 0.75]) {
  const light = new THREE.Mesh(
    new THREE.BoxGeometry(0.5, 0.2, 0.08),
    new THREE.MeshBasicMaterial({color: 0xffffcc})
  );
  light.position.set(x, 0.95, -2.27);
  car.add(light);
}

car.position.set(0, 0, 0);

// CONTROLS
const keys = {};

window.addEventListener('keydown', e => {
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) {
    e.preventDefault();
  }
  keys[e.key] = true;
});

window.addEventListener('keyup', e => {
  keys[e.key] = false;
});

let velocity = 0;
let steering = 0;

const speedDisplay = document.getElementById('speed');

// GAME LOOP
function animate() {
  requestAnimationFrame(animate);

  // ACCELERATION
  if (keys.ArrowUp) velocity -= 0.012;
  if (keys.ArrowDown) velocity += 0.012;

  // BRAKING
  if (keys[' ']) velocity *= 0.90;

  // FRICTION
  velocity *= 0.993;
  velocity = THREE.MathUtils.clamp(velocity, -0.35, 1.0);

  // STEERING
  const moving = Math.abs(velocity) > 0.005;

  if (keys.ArrowLeft) steering = 1;
  else if (keys.ArrowRight) steering = -1;
  else steering *= 0.85;

  if (moving) {
    car.rotation.y += steering * Math.abs(velocity) * 0.035
      * (velocity < 0 ? -1 : 1);
  }

  // MOVE CAR
  car.position.x -= Math.sin(car.rotation.y) * velocity;
  car.position.z -= Math.cos(car.rotation.y) * velocity;

  // WHEEL ROTATION
  wheels.forEach(w => w.rotation.x += velocity * 0.5);

  // CAMERA FOLLOW
  const cameraOffset = new THREE.Vector3(0, 6, 12);
  cameraOffset.applyAxisAngle(
    new THREE.Vector3(0, 1, 0),
    car.rotation.y
  );

  const targetCamera = car.position.clone().add(cameraOffset);
  camera.position.lerp(targetCamera, 0.08);

  const lookTarget = car.position.clone();
  lookTarget.y += 1;
  lookTarget.z -= 5;
  camera.lookAt(lookTarget);

  // HUD
  speedDisplay.textContent = Math.round(
    Math.abs(velocity) * 120
  );

  renderer.render(scene, camera);
}

animate();

// RESIZE
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
